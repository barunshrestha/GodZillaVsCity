<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kart 64 — Retro Racing</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <h1>KART 64</h1>
      <p class="subtitle">Retro 64-bit Kart Racing</p>
      <div class="controls-info">
        <p><span class="key">↑</span> Accelerate</p>
        <p><span class="key">↓</span> Brake / Reverse</p>
        <p><span class="key">←</span> <span class="key">→</span> Steer</p>
      </div>
      <button id="start-btn">START RACE</button>
      <p class="hint">Complete 3 laps to win!</p>
    </div>

    <!-- Countdown -->
    <div id="countdown" class="overlay hidden">
      <span id="countdown-text">3</span>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-panel">
          <span class="label">LAP</span>
          <span id="lap-display">1 / 3</span>
        </div>
        <div class="hud-panel">
          <span class="label">TIME</span>
          <span id="time-display">0:00.0</span>
        </div>
        <div class="hud-panel">
          <span class="label">POS</span>
          <span id="position-display">1 / 4</span>
        </div>
      </div>
      <div class="hud-bottom">
        <div class="speedometer">
          <span id="speed-display">0</span>
          <span class="unit">KM/H</span>
        </div>
      </div>
    </div>

    <!-- Finish screen -->
    <div id="finish-screen" class="overlay hidden">
      <h1 id="finish-title">FINISH!</h1>
      <p id="finish-message"></p>
      <p id="finish-time"></p>
      <button id="restart-btn">RACE AGAIN</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
